line-length = 88
target-version = "py312"

[lint.per-file-ignores]
# Imports in __init__.py register models; Odoo keeps one per line, order matters.
"__init__.py" = ["F401", "I001"]
# A manifest is a bare dict literal by design.
"__manifest__.py" = ["B018"]

[lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "odoo",
    "odoo-addons",
    "first-party",
    "local-folder",
]

[lint.isort.sections]
"odoo" = ["odoo"]
"odoo-addons" = ["odoo.addons"]
